name: CI

on:
  # Every branch here gets a PR opened right after it's pushed, so `push` on
  # every branch and `pull_request` fire twice for the identical commit — two
  # full `verify` runs (Playwright browser install included) for one push.
  # `push` only needs to cover what `pull_request` can't: verifying `main`
  # itself after a merge, and tag pushes for the release job.
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The offline guarantee is the product promise: download one file,
      # disconnect, and nothing you open ever leaves your machine. These two
      # checks stop that from silently regressing on a dependency bump.
      - name: Check offline build is self-contained
        run: npm run check:offline

      - name: Install Chromium for the runtime offline check
        run: npx playwright install --with-deps chromium

      # The load-bearing check: loads the real built page from disk with the
      # network cut, drives every tool, and fails if anything is requested.
      # Static analysis cannot see a URL assembled at runtime.
      - name: Verify nothing is fetched at runtime
        run: npm run check:offline:runtime

      # Keep the artifact downloadable from every run so a failure is
      # inspectable, not just a red check.
      - name: Upload offline build
        uses: actions/upload-artifact@v4
        with:
          name: offline-pdf-utility-html
          path: dist/index.html
          if-no-files-found: error

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publish the exact file `verify` checked, rather than building again
      # here. A rebuild is a different artifact that nothing has proven makes
      # zero network requests — and the promise users are asked to trust is
      # about the bytes they download, not about a build that resembles them.
      - name: Download the verified offline build
        uses: actions/download-artifact@v4
        with:
          name: offline-pdf-utility-html
          path: release

      - name: Checksum the artifact
        id: checksum
        run: |
          cd release
          sha256sum index.html > SHA256SUMS.txt
          echo "sha256=$(cut -d ' ' -f 1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt

      - name: Attach the offline build to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/index.html
            release/SHA256SUMS.txt
          body: |
            Download `index.html` and open it in your browser. That single file
            is the whole application — no installation, no unzipping, and no
            network access at any point.

            **Verify what you downloaded.** This is the exact file this release
            workflow built and checked, not a later rebuild. Its SHA-256 is:

            ```
            ${{ steps.checksum.outputs.sha256 }}
            ```

            Check it yourself before trusting it:

            ```
            sha256sum index.html          # Linux
            shasum -a 256 index.html      # macOS
            CertUtil -hashfile index.html SHA256   # Windows
            ```

            Before publishing, this file passed both offline checks: it is a
            single self-contained page with nothing fetchable in it, and loading
            it from disk with the network blocked and driving every tool
            produced zero network requests.
